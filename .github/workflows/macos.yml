# Сборка F_ckCensor для macOS: universal (Apple Silicon + Intel), .dmg — в артефактах запуска.
# Запускается при пуше в main, а также вручную (Actions → macOS → Run workflow).
name: macOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "номер версии в программе (пусто — как в коде); старый — чтобы проверить автообновление"
        required: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Сборка
        env:
          FKC_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -o pipefail
          bash packaging/macos/build.sh 2>&1 | tee build.log

      # ошибка сборки — конец лога в аннотацию запуска, чтобы её было видно без входа
      - name: Ошибка сборки
        if: failure()
        run: |
          msg=$(tail -n 80 build.log | LC_ALL=C tr -cd '\n\40-\176' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=build::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: F_ckCensor-macos
          # в релиз кладутся оба: .dmg — для установки, F_ckCensor-mac.zip — для автообновления
          path: |
            dist/macos/*.dmg
            dist/macos/F_ckCensor-mac.zip
          if-no-files-found: error
